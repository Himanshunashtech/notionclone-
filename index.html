<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zotion - Connected Workspace for Docs, Notes & AI</title>

    <!-- SEO & Search Engines -->
    <meta name="description" content="Zotion is the connected workspace where better, faster work happens. Plan, write, collaborate, and get organized with real-time sync, database views, and AI integration." />
    <meta name="keywords" content="Zotion, Notion clone, Workspace, Docs, Notes, AI, Database, Productivity, Real-time Collaboration" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Open Graph / Social Sharing (with app favicon icon integration) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Zotion - Connected Workspace for Docs, Notes & AI" />
    <meta property="og:description" content="Plan, write, collaborate, and get organized in one fluid, AI-powered connected workspace." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@zotion_app" />
    <meta name="twitter:title" content="Zotion - Connected Workspace for Docs, Notes & AI" />
    <meta name="twitter:description" content="Plan, write, collaborate, and get organized in one fluid, AI-powered connected workspace." />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- GEO Optimization Tags -->
    <meta name="geo.region" content="US-CA" />
    <meta name="geo.placename" content="San Francisco" />
    <meta name="geo.position" content="37.7749;-122.4194" />
    <meta name="ICBM" content="37.7749, -122.4194" />

    <!-- AEO (Answer Engine Optimization) -->
    <meta name="ai-engine-target" content="Answer-Engine-Optimization" />
    <meta name="entity:type" content="SoftwareApplication, WorkspacePlatform" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      .font-poppins { font-family: 'Poppins', sans-serif; }
      .font-inter { font-family: 'Inter', sans-serif; }
      .font-lora { font-family: 'Lora', serif; }
      .font-jetbrains-mono { font-family: 'JetBrains Mono', monospace; }
      
      :root {
        --font-inter: 'Inter', sans-serif;
        --font-lora: 'Lora', serif;
        --font-jetbrains-mono: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
