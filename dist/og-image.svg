<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Light Vibrant Poster Gradients -->
    <linearGradient id="poster-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="50%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="card-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
  </defs>

  <!-- Bright Light Poster Background -->
  <rect width="1200" height="630" fill="url(#poster-bg)" />
  
  <!-- Outer Poster Frame Border -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="12 8" opacity="0.4" />
  <rect x="45" y="45" width="1110" height="540" rx="20" fill="none" stroke="#e0e7ff" stroke-width="2" />

  <!-- Decorative Color Accents -->
  <circle cx="1080" cy="90" r="70" fill="#a855f7" opacity="0.1" />
  <circle cx="120" cy="530" r="90" fill="#3b82f6" opacity="0.1" />

  <!-- App Favicon Logo Badge (White Container with Soft Shadow) -->
  <g transform="translate(80, 80)">
    <rect width="110" height="110" rx="24" fill="#ffffff" stroke="#e0e7ff" stroke-width="2" />
    <!-- Embedded Zotion Favicon Path -->
