    </g>
  </g>

  <!-- Title & Subtitle Poster Style -->
  <text x="220" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="56" fill="#1e1b4b" letter-spacing="-1.5">Zotion</text>
  <text x="220" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#6366f1">The Connected Workspace for Every Team</text>

  <!-- Main Headline Poster Banner -->
  <text x="80" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#0f172a">Plan, Write &amp; Collaborate in One Fluid Space</text>

  <!-- Bright Poster Cards for Zotion Features -->
  <g transform="translate(80, 290)">
    <!-- Feature 1: Notes & Docs -->
    <g transform="translate(0, 0)">
      <rect width="500" height="90" rx="16" fill="url(#card-purple)" stroke="#d8b4fe" stroke-width="1.5" />
      <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#581c87">📝 Docs &amp; Notes</text>
      <text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#6b21a8">Write with rich block styles, covers, and real-time syncing.</text>
    </g>

    <!-- Feature 2: Databases & Views -->
    <g transform="translate(530, 0)">
      <rect width="500" height="90" rx="16" fill="url(#card-blue)" stroke="#93c5fd" stroke-width="1.5" />
      <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#1e3a8a">📊 Flexible Databases</text>
      <text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#1d4ed8">Switch between Table, Kanban boards, and Gallery views easily.</text>
    </g>

    <!-- Feature 3: Collaboration & Share -->
    <g transform="translate(0, 110)">
      <rect width="500" height="90" rx="16" fill="url(#card-emerald)" stroke="#6ee7b7" stroke-width="1.5" />
      <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#064e3b">🤝 Live Team Collaboration</text>
      <text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#047857">Share links, leave inline comments, and edit documents together.</text>
    </g>

    <!-- Feature 4: Teamspaces & Templates -->
    <g transform="translate(530, 110)">
      <rect width="500" height="90" rx="16" fill="url(#card-amber)" stroke="#fcd34d" stroke-width="1.5" />
      <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#78350f">🚀 Teamspaces &amp; Templates</text>
      <text x="24" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#b45309">Organize Projects, Meetings, Docs, and Tasks efficiently.</text>
    </g>
  </g>

  <!-- Poster Footer Bar -->
  <line x1="80" y1="520" x2="1110" y2="520" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="80" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#475569">Everything you need to organize your thoughts and work.</text>
  <text x="1110" y="555" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#4f46e5">zotion.app</text>
</svg>
